<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joseph Mesches</title>
<meta name="description" content="Joseph Mesches — Electrical Engineering student and critical-care flight paramedic. Résumé, CV, and contact links.">
<style>
  :root{
    --accent:#1F4E5F;
    --accent-2:#2c6e84;
    --ink:#1c1c1e;
    --muted:#5f646b;
    --bg:#f4f6f7;
    --card:#ffffff;
    --line:#e3e7ea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#eef1f3; --muted:#a7afb6; --bg:#12171a; --card:#1a2226; --line:#2b353b;
      --accent:#4aa3bd; --accent-2:#6cbdd4;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; line-height:1.5;
  }
  .card{
    width:100%; max-width:460px; background:var(--card);
    border:1px solid var(--line); border-radius:16px; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
  }
  .bar{height:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .inner{padding:32px 28px 26px}
  h1{margin:0 0 6px; font-size:1.9rem; letter-spacing:-.01em}
  .titles{margin:0 0 22px; color:var(--muted); font-size:.98rem}
  .titles .hl{color:var(--accent); font-weight:600}
  .links{display:flex; flex-direction:column; gap:12px}
  .btn{
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 18px; border-radius:11px; text-decoration:none;
    font-size:1.05rem; font-weight:600; border:1.5px solid var(--line);
    color:var(--ink); background:transparent; transition:transform .05s ease, border-color .15s;
  }
  .btn:active{transform:scale(.99)}
  .btn .sub{font-weight:400; color:var(--muted); font-size:.85rem}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary .sub{color:rgba(255,255,255,.8)}
  .btn .arrow{color:var(--accent); font-weight:700}
  .btn.primary .arrow{color:#fff}
  .btn:hover{border-color:var(--accent)}
  footer{margin-top:22px; text-align:center; color:var(--muted); font-size:.82rem}
  footer a{color:var(--muted)}
</style>
</head>
<body>
  <main class="card">
    <div class="bar"></div>
    <div class="inner">
      <h1>Joseph Mesches</h1>
      <p class="titles">
        <span class="hl">Electrical Engineering Student</span> · Colorado State University<br>
        <span class="hl">Flight Paramedic (FP-C)</span>
      </p>

      <nav class="links">
        <a class="btn primary" href="Mesches_Resume.pdf" download>
          <span>Résumé <span class="sub">1-page</span></span><span class="arrow">↓</span>
        </a>
        <a class="btn" href="Mesches_CV.pdf" download>
          <span>Full CV <span class="sub">complete</span></span><span class="arrow">↓</span>
        </a>
        <a class="btn" href="https://www.linkedin.com/in/joe-mesches">
          <span>LinkedIn</span><span class="arrow">→</span>
        </a>
        <a class="btn" href="mailto:jmesches@gmail.com">
          <span>Email</span><span class="arrow">→</span>
        </a>
      </nav>

      <footer>Machine Learning · Signal Processing · Embedded Systems</footer>
    </div>
  </main>
</body>
</html>
